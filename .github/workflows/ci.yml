name: Quality
on:
  push:
    branches: ['**']
    # Evidence-only pushes must not replace a running source validation.
    paths-ignore: ['docs/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '15.0'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Packaging regression tests
        run: python -m unittest discover -s packaging -p "test_*.py" -v
      - name: Windows native filesystem preflight
        if: runner.os == 'Windows'
        run: cargo test --locked -p keelshell-platform --lib -- --test-threads=1
      - name: Windows archive codec preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $listing = & cargo test --locked -p keelshell-core --test archive -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listing
          foreach ($case in @(
            'reencoding_discards_dangerous_incoming_permissions_and_ownership',
            'zip_records_private_file_and_directory_modes_in_unix_metadata'
          )) {
            if ($listing -cnotcontains "${case}: test") {
              throw "Required archive codec test was not compiled: $case"
            }
          }
          cargo test --locked -p keelshell-core --test archive -- --test-threads=1
          exit $LASTEXITCODE
      - name: Windows session backend preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $listing = & cargo test --locked -p keelshell-session --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listing
          foreach ($case in @(
            'sftp::archive_transfer::local::tests::windows_archive_private_nested_tree_publishes_after_child_creation_handles_close',
            'sftp::archive_transfer::local::tests::windows_archive_empty_private_tree_publishes_with_exact_root_identity',
            'sftp::archive_transfer::local::tests::windows_archive_same_content_replacement_after_release_fails_published_readback',
            'zmodem::local::tests::zmodem_windows_retained_source_blocks_ancestor_rename_and_preserves_review',
            'zmodem::local::tests::zmodem_windows_retained_reviews_block_grandparent_rename_and_preserve_namespace',
            'zmodem::local::tests::zmodem_local_publication_rejects_a_replaced_parent_without_writing_either_tree'
          )) {
            if ($listing -cnotcontains "${case}: test") {
              throw "Required Windows session test was not compiled: $case"
            }
          }
          cargo test --locked -p keelshell-session --lib -- --test-threads=1
          exit $LASTEXITCODE
      - name: Rust quality gate
        run: python scripts/check.py
      - name: Prepare Linux OpenSSH interoperability server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y openssh-server
          sudo install -d -m 0755 /run/sshd
      # The script deliberately rejects Windows; native Rust tests above still run there.
      - name: OpenSSH interoperability (macOS and Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: python scripts/openssh_interop.py
      - name: Preserve OpenSSH interoperability receipts
        if: always() && (runner.os == 'macOS' || runner.os == 'Linux')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssh-interop-${{ runner.os }}-${{ runner.arch }}
          path: work/openssh-interop/
          if-no-files-found: warn
          retention-days: 7
