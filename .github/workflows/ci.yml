name: Quality
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '15.0'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Packaging regression tests
        run: python -m unittest discover -s packaging -p "test_*.py" -v
      - name: Rust quality gate
        run: python scripts/check.py
      - name: Prepare Linux OpenSSH interoperability server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y openssh-server
          sudo install -d -m 0755 /run/sshd
      # The script deliberately rejects Windows; native Rust tests above still run there.
      - name: OpenSSH interoperability (macOS and Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: python scripts/openssh_interop.py
      - name: Preserve OpenSSH interoperability receipts
        if: always() && (runner.os == 'macOS' || runner.os == 'Linux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssh-interop-${{ runner.os }}-${{ runner.arch }}
          path: work/openssh-interop/
          if-no-files-found: warn
          retention-days: 7
