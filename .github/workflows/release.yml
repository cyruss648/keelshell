name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '15.0'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Tag matches workspace version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/release.py validate-ref --tag "$RELEASE_TAG"
      - name: Changelog contains the release entry
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/changelog.py check --version "${RELEASE_VERSION#v}"
      - name: Packaging regression tests
        run: python -m unittest discover -s packaging -p 'test_*.py' -v
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
            target: aarch64-apple-darwin
            executable: keelshell-app
          - os: macos-26-intel
            platform: macos
            target: x86_64-apple-darwin
            executable: keelshell-app
          - os: windows-2025
            platform: windows
            target: x86_64-pc-windows-msvc
            executable: keelshell-app.exe
          - os: windows-11-arm
            platform: windows
            target: aarch64-pc-windows-msvc
            executable: keelshell-app.exe
          - os: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            executable: keelshell-app
          - os: ubuntu-24.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
            executable: keelshell-app
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Verify native Rust target
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV | grep -Fx "host: $BUILD_TARGET"
          rustup target add "$BUILD_TARGET"
          echo "KEELSHELL_BUILD_COMMIT=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_ENV"
      - name: Quality gate
        run: python scripts/check.py
      - name: Release binary
        run: cargo build -p keelshell-app --release --locked --target ${{ matrix.target }}
      - name: Stage platform package
        run: python packaging/package.py ${{ matrix.platform }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output work/stage --target ${{ matrix.target }}
      - name: Native package inspection
        run: python packaging/inspect_native.py --platform ${{ matrix.platform }} --stage work/stage --target ${{ matrix.target }}
      - name: Archive and verify architecture
        run: python packaging/release.py archive --platform ${{ matrix.platform }} --target ${{ matrix.target }} --stage work/stage --output work/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: work/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  collect:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: work/downloads
      - name: Verify complete release set
        run: python packaging/release.py collect --input work/downloads --output work/collected
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          path: work/collected/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: work/collected
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_COMMIT=$(git rev-parse 'HEAD^{commit}')
          python packaging/publish.py --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --directory work/collected
