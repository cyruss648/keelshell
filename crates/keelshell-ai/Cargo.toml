[package]
name = "keelshell-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Explicit, reviewable AI context and provider requests for KeelShell"

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true
uuid.workspace = true
tokio.workspace = true
sha2.workspace = true
base64.workspace = true
tempfile.workspace = true
process-wrap = { version = "10.0", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false }

[target.'cfg(windows)'.dependencies]
win32job = "2.0"

[[test]]
name = "local_agent_process"
harness = false

[lints]
workspace = true
